<br><zero-md><template shadowrootmode="open"><div class="markdown-styles" data-hash="yzla1o"><style>:host{display:block;position:relative;contain:content;}:host([hidden]){display:none;}</style><link rel="stylesheet" href="https://pyvaluador.dlsi.ua.es/pyvaluador/npm/github-markdown-css@5/github-markdown.min.css"><link rel="stylesheet" href="https://pyvaluador.dlsi.ua.es/pyvaluador/npm/@highlightjs/cdn-assets@11/styles/github.min.css"><link rel="stylesheet" href="https://pyvaluador.dlsi.ua.es/pyvaluador/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css" media="(prefers-color-scheme:dark)"><link rel="stylesheet" href="https://pyvaluador.dlsi.ua.es/pyvaluador/npm/katex@0/dist/katex.min.css"></div><div class="markdown-body" data-hash="sia294"><h1 id="problema-p100-días-de-permiso-solución-completa">Problema P100: Días de permiso (solución completa)</h1>
<p><strong>Autor:</strong> DLSI</p>
<h2 id="descripción">Descripción</h2>
<p>Una empresa permite a sus empleados elegir un número máximo de días libres, siempre que estén separados al menos por <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> días entre sí.</p>
<p>Un trabajador asigna un valor <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>V</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">V_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.22222em;">V</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> a cada día disponible del calendario. El objetivo es <strong>elegir como máximo <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.10903em;">N</span></span></span></span> días de permiso</strong>, de forma que:</p>
<ul>
<li>No haya dos días seleccionados a menos de <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> días de diferencia</li>
<li>La suma de los valores sea máxima</li>
</ul>
<p>Vamos a mostrar un ejemplo:</p>

# Problema P100: Días de permiso (solución completa)

**Autor:** DLSI

## Descripción

Una empresa permite a sus empleados elegir un número máximo de días libres, siempre que estén separados al menos por $ L $ días entre sí.


Un trabajador asigna un valor $ V_i $ a cada día disponible del calendario. El objetivo es **elegir como máximo $ N $ días de permiso**, de forma que:
- No haya dos días seleccionados a menos de $ L $ días de diferencia
- La suma de los valores sea máxima

que devuelva **los días elegidos** (primer día es el 1) correspondientes **al mayor valor total obtenible al elegir un máximo de $ N $ días de permiso**, manteniendo al menos $ L $ días de diferencia entre ellos.

La entrada es una cadena con $ M+2 $ enteros separados por espacios:
- Los dos primeros son: $ N $ (máximo de días permitidos), $ L $ (diferencia mínima entre días)
- El resto son los valores asociados a cada día del calendario

## Ejemplo 1

- Entrada: "3 2 1 2 4 7 3"

- Salida esperada: [2,4] correspondiente a una valoración final de 9

- Justificación:

    - Se pueden elegir como máximo 3 días, con diferencia mínima de 2 días entre ellos.
    - Mejor combinación: días 2 y 4 (primer día con índice 1) → valores: 2 + 7 = 9

## Ejemplo 2

- Entrada: "2 5 11 2 12 6 19 10 13 2 16 1"

- Salida esperada: [3,9] correspondiente a una valoración final de 28

- Justificación:

  - Máximo 2 días seleccionables, con al menos 5 días de diferencia entre ellos.
  - Mejores días: 3 y 9 (primer día con índice 1) → valores: 12 + 16 = 28

### Nota importante

- $ L = 1 $ significa que se pueden elegir días consecutivos.
- $ N = 0 $ significa que no se puede elegir ningún día.
